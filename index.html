<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谁便整理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4f8, #e8edf5);
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: 36px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        /* 分栏网格布局：电脑3栏，平板2栏，手机1栏 */
        .pdf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 30px;
        }

        .pdf-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .pdf-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .card-head {
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            color: #fff;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }

        .pdf-iframe {
            width: 100%;
            height: 520px;
            border: none;
        }

        .card-foot {
            padding: 14px;
            text-align: center;
            background: #f8fafc;
        }

        .card-foot a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">随便整理，只整理重要的地方</h1>

        <div class="pdf-grid">
            <!-- 第一栏 PDF 1 -->
            <div class="pdf-card">
                <div class="card-head">指数对数与三角函数 知识点</div>
                <iframe class="pdf-iframe" src="/pdfs/高中数学.pdf" type="application/pdf"></iframe>
                <div class="card-foot">
                    <a href="/pdfs/pdf1.pdf" target="_blank">新标签页打开 / 下载PDF</a>
                </div>
            </div>

            <!-- 第二栏 PDF 2 复制这一块可以无限加栏目 -->
            <div class="pdf-card">
                <div class="card-head">暂无</div>
                <iframe class="pdf-iframe" src="" type="application/pdf"></iframe>
                <div class="card-foot">
                    <a href="/pdfs/pdf2.pdf" target="_blank">新标签页打开 / 下载PDF</a>
                </div>
            </div>

            <!-- 想加第三栏、第四栏，直接复制上面一个 pdf-card 整块即可 -->

        </div>
    </div>
</body>
</html>
