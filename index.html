<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随便整理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4f8, #e8edf5);
            padding: 40px 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: 36px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        /* 分栏加宽，大屏两栏，手机一栏，保证PDF够大 */
        .pdf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(700px, 1fr));
            gap: 40px;
        }

        .pdf-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .pdf-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .card-head {
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            color: #fff;
            padding: 18px;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
        }

        /* PDF 高度拉到 850，超大看得清 */
        .pdf-iframe {
            width: 100%;
            height: 850px;
            border: none;
        }

        .card-foot {
            padding: 16px;
            text-align: center;
            background: #f8fafc;
        }

        .card-foot a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            font-size: 17px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">随便整理的知识点，我乱搞的，可能不全而且只有重点</h1>

        <div class="pdf-grid">
            <!-- 第一栏 PDF -->
            <div class="pdf-card">
                <div class="card-head">指数对数与三角函数 知识点</div>
                <iframe class="pdf-iframe" src="/pdfs/math1.pdf" type="application/pdf"></iframe>
                <div class="card-foot">
                    <a href="/pdfs/pdf1.pdf" target="_blank">新标签页打开 / 下载PDF（可放大阅读）</a>
                </div>
            </div>

            <!-- 第二栏 PDF 要多加直接复制这一块 -->
            <div class="pdf-card">
                <div class="card-head">语文 暂无</div>
                <iframe class="pdf-iframe" src="" type="application/pdf"></iframe>
                <div class="card-foot">
                    <a href="/pdfs/pdf2.pdf" target="_blank">新标签页打开 / 下载PDF（可放大阅读）</a>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
