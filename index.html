                <h1>IGCSE Biology U10-13总结</h1>
<h3>Unit 10: Diseases and Immunity (疾病与免疫)</h3>
<h4>1. Pathogens & Transmission (病原体与传播)</h4>
<ul>
<li><strong>Pathogen (病原体):</strong> A microorganism that causes disease. (引起疾病的微生物)</li>
<li><strong>Transmissible Disease (可传播疾病):</strong> Can be passed from host to host. (可在宿主间传播的疾病)</li>
<li><strong>Transmission (传播):</strong> Movement of pathogen from one host to another. (病原体从一个宿主到另一个的移动)</li>
<li><strong>Direct Contact (直接接触):</strong> e.g., Blood-to-blood (HIV - 艾滋病病毒), shared towel (Athlete's foot - 足癣).</li>
<li><strong>Indirect Transmission (间接传播):</strong> 
<ul>
<li><strong>Airborne/Droplets (空气/飞沫):</strong> Coughs, sneezes (Cold, Flu, COVID-19 - 感冒、流感、新冠病毒).</li>
<li><strong>Contaminated Food/Water (受污染的食物/水):</strong> (Salmonella - 沙门氏菌, Cholera - 霍乱).</li>
<li><strong>Surface Contact (接触表面):</strong> Touching contaminated surfaces then mouth.</li>
</ul>
</li>
<li><strong>难点/考点 (Difficulty/Exam Point):</strong> Clearly distinguishing between <strong>direct contact</strong> and the various <strong>indirect transmission</strong> methods. You must be able to list examples. (清晰区分直接接触和各种间接传播方式，并能够举例说明。)</li>
</ul>
<h4>2. Body Defenses (身体防御)</h4>
<ul>
<li><strong>First Line of Defence (第一道防线):</strong> 
<ul>
<li><strong>Skin (皮肤):</strong> Physical barrier. (物理屏障)</li>
<li><strong>Mucus & Cilia (黏液与纤毛):</strong> In airways, trap and move pathogens up and out. (在呼吸道中，捕捉并向上移动病原体排出)</li>
<li><strong>Stomach Acid (胃酸):</strong> Kills pathogens. (杀灭病原体)</li>
<li><strong>Tears/Saliva (眼泪/唾液):</strong> Contain lysozyme (溶菌酶) that kills bacteria.</li>
<li><strong>Urine Flow (尿流):</strong> Flushes pathogens from bladder/urethra. (将病原体冲出膀胱/尿道)</li>
</ul>
</li>
<li><strong>Second Line of Defence (第二道防线 - White Blood Cells 白细胞):</strong> 
<ul>
<li><strong>Phagocytosis (吞噬作用):</strong> <strong>Phagocytes (吞噬细胞)</strong> engulf and digest pathogens. (吞噬细胞包围并消化病原体)</li>
<li><strong>Antibody Production (抗体产生):</strong> <strong>Lymphocytes (淋巴细胞)</strong> produce <strong>antibodies (抗体)</strong> to destroy pathogens.</li>
</ul>
</li>
<li><strong>难点/考点 (Difficulty/Exam Point):</strong> Understanding the <strong>specificity</strong> of antibodies. Each antibody has a specific shape <strong>complementary</strong> to an <strong>antigen (抗原)</strong> on a pathogen. (理解抗体的特异性：每种抗体都有一个与病原体上抗原互补的特定形状。)</li>
</ul>
<h4>3. The Immune Response & Immunity (免疫反应与免疫力)</h4>
<ul>
<li><strong>Antigen (抗原):</strong> Molecules on pathogen's surface. (病原体表面的分子)</li>
<li><strong>Antibody (抗体):</strong> Protein molecules produced by lymphocytes; shape fits antigens. (淋巴细胞产生的蛋白质分子，形状与抗原契合)</li>
<li><strong>Memory Cells (记忆细胞):</strong> Long-lived lymphocytes that remain after infection. It allows a <strong>faster, stronger secondary immune response</strong>, preventing illness. (感染后长期存活的淋巴细胞，允许更快、更强的二次免疫反应，防止生病。)</li>
<li><strong>Immunity Types (免疫力类型):</strong>
<table>
<thead>
<tr>
<th><strong>Feature</strong></th>
<th><strong>Active Immunity (主动免疫)</strong></th>
<th><strong>Passive Immunity (被动免疫)</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Source (来源)</strong></td>
<td>Body's own lymphocytes make antibodies & memory cells
(自身产生抗体和记忆细胞)</td>
<td>Antibodies from another organism
(从外部获得抗体)</td>
</tr>
<tr>
<td><strong>How Acquired (获取方式)</strong></td>
<td>1. Catching & recovering from disease (自然感染)
2. Vaccination (疫苗接种)</td>
<td>1. Mother's breast milk (母乳)
2. Injections of antibodies (注射抗体血清)</td>
</tr>
<tr>
<td><strong>Duration (持久性)</strong></td>
<td>Long-term (Often lifelong because memory cells exist)
(长期，常有终生免疫)</td>
<td>Short-term (No memory cells, antibodies break down)
(短期，无记忆细胞)</td>
</tr>
</tbody>
</table>
</li>
<li><strong>难点/考点 (Difficulty/Exam Point):</strong> <strong>Vaccination (疫苗接种)</strong> works by introducing a weakened/dead pathogen or its antigens. This triggers your immune system to produce <strong>memory cells</strong> without getting sick. Understand why the <strong>primary response</strong> is slow, and the <strong>secondary response</strong> is fast & massive. (疫苗接种的原理：它引入弱化/死亡的病原体或其抗原，在不生病的前提下触发免疫系统产生记忆细胞。必须理解初次免疫反应慢，二次免疫反应又快又强的原因。)</li>
</ul>
<h4>4. Cholera Case Study (霍乱案例研究)</h4>
<ul>
<li><strong>Pathogen:</strong> Bacterium (细菌)</li>
<li><strong>Transmission:</strong> Contaminated water/food with faeces. (被粪便污染的水/食物)</li>
<li><strong>Mechanism (机制):</strong> 
<ol>
<li>Bacteria produce a <strong>toxin (毒素)</strong> in small intestine.</li>
<li>Toxin stimulates cells to <strong>secrete chloride ions (Cl⁻)</strong> into the lumen.</li>
<li>This lowers the <strong>water potential (水势)</strong> in the lumen.</li>
<li><strong>Osmosis (渗透作用):</strong> Water moves from blood into the intestine.</li>
</ol>
</li>
<li><strong>Result:</strong> Severe <strong>diarrhoea (腹泻)</strong> -> <strong>dehydration (脱水)</strong> and loss of ions; can be fatal.</li>
<li><strong>难点/考点 (Difficulty/Exam Point):</strong> Tracing the chain of events from the cholera toxin action to the symptom of diarrhoea. A classic FRQ topic. (追踪从霍乱毒素作用到腹泻症状的完整链条。这是一个经典的FRQ主题。)</li>
</ul>
<hr />
<h3>Unit 11: Respiration and Gas Exchange (呼吸与气体交换)</h3>
<h4>1. Respiration (呼吸作用)</h4>
<ul>
<li><strong>Definition:</strong> The process of releasing energy from glucose. (从葡萄糖中释放能量的过程)</li>
<li><strong>Aerobic Respiration (有氧呼吸):</strong> 
<ul>
<li>Equation: Glucose + Oxygen -> Carbon Dioxide + Water + Energy (大量)</li>
<li>Location: <strong>Mitochondria (线粒体)</strong></li>
</ul>
</li>
<li><strong>Anaerobic Respiration (无氧呼吸):</strong> 
<ul>
<li><strong>In Humans (人体):</strong> Glucose -> Lactic Acid + Energy (少量). (产生乳酸)</li>
<li><strong>In Plants/Yeast (植物/酵母):</strong> Glucose -> Ethanol + Carbon Dioxide + Energy. (产生酒精和二氧化碳)</li>
</ul>
</li>
<li><strong>Oxygen Debt (氧债):</strong> The amount of oxygen needed to break down the lactic acid built up during anaerobic respiration. (分解无氧呼吸积累的乳酸所需的氧量。)</li>
</ul>
<h4>2. Gas Exchange in Humans (人体气体交换)</h4>
<ul>
<li><strong>Alveoli (肺泡):</strong> Site of gas exchange. (气体交换的场所)</li>
<li><strong>Adaptations of Alveoli (肺泡的适应性特征):</strong>
<ol>
<li><strong>Large surface area (大表面积):</strong> Total area > 100 m².</li>
<li><strong>Thin walls (壁薄):</strong> One cell thick for short diffusion distance.</li>
<li><strong>Good blood supply (丰富血供):</strong> Maintains concentration gradient.</li>
<li><strong>Ventilation (通气):</strong> Breathing movements keep air fresh.</li>
</ol>
</li>
<li><strong>Inspired vs Expired Air (吸入气 vs 呼出气):</strong>
<table>
<thead>
<tr>
<th><strong>Gas</strong></th>
<th><strong>Inspired (吸入)</strong></th>
<th><strong>Expired (呼出)</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Oxygen (O₂)</strong></td>
<td>High (21%)</td>
<td>Low (16%)</td>
</tr>
<tr>
<td><strong>Carbon Dioxide (CO₂)</strong></td>
<td>Low (0.04%)</td>
<td>High (4%)</td>
</tr>
<tr>
<td><strong>Water Vapour (水蒸气)</strong></td>
<td>Variable</td>
<td>Saturated (饱和)</td>
</tr>
</tbody>
</table>
</li>
<li><strong>难点/考点 (Difficulty/Exam Point):</strong> Explaining why expired air has more CO₂ and less O₂. Using the concepts of <strong>diffusion</strong> and <strong>concentration gradients</strong> between the alveoli and blood. You must be able to link the structure of alveoli to their function for FRQs. (解释为什么呼出气有更多CO₂和更少O₂。用扩散和浓度梯度的概念联系肺泡与血液。对于FRQ，必须能将肺泡的结构与其功能联系起来。)</li>
</ul>
<img src="" />
<hr />
<h3>Unit 12: Coordination and Response (协调与反应)</h3>
<h4>1. The Nervous System (神经系统)</h4>
<ul>
<li><strong>Neurone (神经元):</strong> A nerve cell adapted to carry electrical signals.</li>
<li><strong>Parts of a Neurone (神经元结构):</strong> Dendrite (树突) -> Cell Body (胞体) -> Axon (轴突) -> Nerve Endings (神经末梢).</li>
<li><strong>Myelin Sheath (髓鞘):</strong> Insulates axon, speeds up impulse conduction.</li>
<li><strong>Synapse (突触):</strong> A gap between neurones. 
<ul>
<li>Mechanism: Electrical impulse arrives -> releases <strong>neurotransmitter (神经递质)</strong> -> diffuses across gap -> binds to receptor on next neurone -> triggers new impulse.</li>
</ul>
</li>
<li><strong>Reflex Arc (反射弧):</strong> 
<ul>
<li>Stimulus (刺激) -> Receptor (感受器) -> <strong>Sensory Neurone (感觉神经元)</strong> -> <strong>Relay Neurone (中间神经元)</strong> (in CNS) -> <strong>Motor Neurone (运动神经元)</strong> -> Effector (效应器) -> Response (反应).</li>
<li>Feature: <strong>Automatic (自动的), rapid (快速的), involuntary (不随意的).</strong> Protects body from harm.</li>
</ul>
</li>
</ul>
<h4>2. Hormones (激素) - The Endocrine System (内分泌系统)</h4>
<ul>
<li><strong>Definition:</strong> Chemical messengers secreted by <strong>glands (腺体)</strong>, transported in <strong>blood (血液)</strong>, target specific <strong>target organs (靶器官)</strong> to cause a slow, long-lasting effect.</li>
<li><strong>Fight or Flight Response (战或逃反应):</strong> 
<ul>
<li><strong>Adrenaline (肾上腺素)</strong> from <strong>adrenal glands (肾上腺)</strong>.</li>
<li>Effects: Increase heart rate (心率加快), breathing rate (呼吸加快), pupil dilation (瞳孔放大), release glucose from liver (肝脏释放葡萄糖).</li>
</ul>
</li>
</ul>
<h4>3. Coordination in Plants (植物的协调作用) - Tropisms (向性)</h4>
<ul>
<li><strong>Tropism (向性):</strong> A <strong>growth (生长)</strong> response to a stimulus (stimuli).</li>
<li><strong>Auxin (生长素):</strong> A plant hormone that controls growth.</li>
<li><strong>Phototropism (向光性):</strong>
<ul>
<li><strong>Shoot (茎):</strong> Positive (positive - 向光性). Auxin concentrates on <strong>shady side (背光侧)</strong>, causing cells to elongate faster, bending towards light.</li>
</ul>
</li>
<li><strong>Gravitropism (Geotropism)(向地性):</strong>
<ul>
<li><strong>Root (根):</strong> Positive (towards gravity - 正向地性). Auxin on <strong>lower side</strong> <strong>inhibits (抑制)</strong> cell elongation, causing root to bend down.</li>
<li><strong>Shoot (茎):</strong> Negative (away from gravity - 负向地性). Auxin on <strong>lower side</strong> <strong>promotes (促进)</strong> cell elongation, causing shoot to bend up.</li>
</ul>
</li>
<li><strong>难点/考点 (Difficulty/Exam Point):</strong> Comparing and contrasting the <strong>nervous system (electrical, fast, short-lived)</strong> vs. the <strong>endocrine system (chemical, slow, long-lasting)</strong>. Also, understanding the <strong>uneven distribution of auxin (生长素分布不均)</strong> and its <strong>opposite (不同)</strong> effect on roots vs. shoots for tropism questions. (FRQ中常问：神经系统与内分泌系统的对比。以及理解生长素分布不均及其对根和茎的相反作用。)</li>
</ul>
<hr />
<h3>Unit 13: Excretion and Homeostasis (排泄与稳态)</h3>
<h4>1. Excretion & Urea (排泄与尿素)</h4>
<ul>
<li><strong>Excretion (排泄):</strong> Removal of <strong>metabolic wastes (代谢废物)</strong> from the body. (e.g., CO₂ from lungs, urea from kidneys)</li>
<li><strong>Urea Formation (尿素的形成):</strong> 
<ul>
<li>Location: <strong>Liver (肝脏)</strong></li>
<li>Process: <strong>Deamination (脱氨基作用)</strong> 
<ul>
<li>Excess amino acids cannot be stored.</li>
<li>Liver removes the <strong>nitrogen-containing part (含氮部分)</strong> and converts it to <strong>urea (尿素)</strong>.</li>
</ul>
</li>
</ul>
</li>
</ul>
<img src="" />
<ul>
<li>The rest (energy-containing) is converted to <strong>carbohydrate (碳水化合物)</strong> for storage.</li>
<li><strong>Excretion of Urea (尿素的排泄):</strong> 
<ul>
<li>Urea is toxic.</li>
<li>Transported in blood plasma to kidneys.</li>
<li><strong>Kidneys (肾脏)</strong> filter urea out -> produce <strong>urine (尿液)</strong>.</li>
<li><strong>Urine Path (尿路):</strong> Kidney (肾) -> <strong>Ureter (输尿管)</strong> -> <strong>Bladder (膀胱)</strong> -> <strong>Urethra (尿道)</strong> -> Out.</li>
</ul>
</li>
</ul>
<h4>2. Structure of the Kidney & Nephron (肾脏与肾单位的结构)</h4>
<ul>
<li><strong>Kidney Structure:</strong> Outer <strong>Cortex (皮质)</strong>, Inner <strong>Medulla (髓质)</strong>. Filled with thousands of <strong>nephrons (肾单位)</strong>.</li>
<li><strong>Nephron (肾单位):</strong> The functional unit of the kidney.
<ul>
<li><strong>Glomerulus (肾小球):</strong> A knot of capillaries. <strong>Ultrafiltration (超滤)</strong> occurs here: High blood pressure forces water, urea, glucose, ions out of the blood into the kidney tubule. Large molecules (proteins, blood cells) stay in blood.</li>
<li><strong>Proximal Convoluted Tubule (近曲小管):</strong> <strong>Reabsorption (重吸收)</strong> of useful substances. <strong>All glucose (全部葡萄糖)</strong> and most water/ions are reabsorbed into blood by <strong>active transport (主动运输)</strong>.</li>
<li><strong>Loop of Henle (髓袢):</strong> Creates a high salt concentration in the medulla, needed for water reabsorption.</li>
<li><strong>Collecting Duct (集合管):</strong> Final adjustment of water content. Reabsorbs water if the body is dehydrated.</li>
</ul>
</li>
<li><strong>难点/考点 (Difficulty/Exam Point):</strong> The role of <strong>Active Transport (主动运输)</strong> in reabsorbing glucose. Explaining why glucose appears in the urine of a diabetic person (cannot fully reabsorb due to high concentration in filtrate - 滤液中浓度过高无法完全重吸收). The function of <strong>Loop of Henle (髓袢)</strong> for creating concentration gradient.</li>
</ul>
<h4>3. Homeostasis (稳态) - Blood Glucose Regulation (血糖调节)</h4>
<ul>
<li><strong>Homeostasis (稳态):</strong> Maintaining a constant <strong>internal environment (内部环境)</strong> despite external changes.</li>
<li><strong>Blood Glucose Level (血糖水平):</strong>
<ul>
<li><strong>When High (After eating 进食后):</strong> 
<ol>
<li><strong>Pancreas (胰腺)</strong> detects high glucose.</li>
<li>Secretes <strong>Insulin (胰岛素)</strong>.</li>
<li>Liver converts glucose to <strong>glycogen (糖原)</strong>.</li>
<li>Blood glucose level falls.</li>
</ol>
</li>
<li><strong>When Low (After exercise/exercise 运动后):</strong> 
<ol>
<li>Pancreas detects low glucose.</li>
<li>Secretes <strong>Glucagon (胰高血糖素)</strong>.</li>
<li>Liver converts <strong>glycogen (糖原)</strong> to <strong>glucose (葡萄糖)</strong>.</li>
<li>Blood glucose level rises.</li>
</ol>
</li>
</ul>
</li>
<li><strong>Diabetes Mellitus (糖尿病):</strong>
<ul>
<li>Type 1: Body doesn't produce enough insulin. Must be treated with <strong>insulin injections (注射胰岛素)</strong>. Cannot be taken orally (a protein, would be digested).</li>
<li>Type 2: Body cells don't respond to insulin. Often linked to diet.</li>
</ul>
</li>
<li><strong>难点/考点 (Difficulty/Exam Point):</strong> <strong>Negative feedback (负反馈)</strong> is the key concept. You must be able to describe the complete loop: Stimulus → Receptor → Coordinator → Effector → Response → Returns to normal. Must also be able to explain why <strong>insulin injections (注射)</strong> are needed for Type 1 Diabetes and why <strong>sensor monitoring (传感器监测)</strong> is better than dipsticks for managing it. (负反馈是关键概念，必须能完整描述闭环。同时需解释I型糖尿病需要注射胰岛素的原因，以及为什么传感器比试纸更优。)</li>
</ul>

Chapter 12: Preparation of Salts 盐的制备
Core Concepts 核心概念
1. Solubility Rules 溶解性规则
• All sodium, potassium, ammonium salts and nitrates are soluble.
 所有钠盐、钾盐、铵盐和硝酸盐都可溶。
• Most chlorides are soluble, except silver chloride (AgCl) and lead(II) chloride (PbCl₂).
 大多数氯化物可溶，但氯化银和氯化铅除外。
• Most sulfates are soluble, except barium sulfate (BaSO₄), lead(II) sulfate (PbSO₄), and calcium sulfate (CaSO₄).
 大多数硫酸盐可溶，但硫酸钡、硫酸铅和硫酸钙除外。
• Most carbonates are insoluble, except sodium carbonate (Na₂CO₃), potassium carbonate (K₂CO₃), and ammonium carbonate ((NH₄)₂CO₃).
 大多数碳酸盐不溶，但碳酸钠、碳酸钾和碳酸铵除外。
2. Preparation of Soluble Salts 可溶盐的制备
Method A: Acid + excess metal / insoluble base / insoluble carbonate
方法A：酸 + 过量金属/不溶碱/不溶碳酸盐 


• Steps: Warm acid → add excess solid → filter to remove excess solid → evaporate filtrate → crystallise → dry.
 步骤：加热酸 → 加入过量固体 → 过滤除去过量固体 → 蒸发滤液 → 结晶 → 干燥。
• Examples: 
  • Magnesium + sulfuric acid: Mg(s) + H₂SO₄(aq) → MgSO₄(aq) + H₂(g)
  • Copper(II) oxide + sulfuric acid: CuO(s) + H₂SO₄(aq) → CuSO₄(aq) + H₂O(l)
  • Zinc carbonate + sulfuric acid: ZnCO₃(s) + H₂SO₄(aq) → ZnSO₄(aq) + H₂O(l) + CO₂(g)
• Key point: Excess solid ensures all acid is consumed; filtration removes unreacted solid.
 关键点：过量固体确保酸完全反应；过滤除去未反应的固体。
Method B: Titration (acid + alkali / soluble carbonate)
方法B：滴定法（酸 + 碱/可溶碳酸盐） 
• Used when both reactants are soluble (e.g., NaOH + HCl).
 用于两种反应物均可溶的情况。
• Steps: Pipette alkali + indicator → add acid from burette until colour change → repeat without indicator → evaporate → crystallise.
 步骤：用移液管取碱液+指示剂 → 从滴定管加酸至颜色变化 → 不加指示剂重复 → 蒸发 → 结晶。

• Example: NaOH(aq) + HCl(aq) → NaCl(aq) + H₂O(l)
• Apparatus: burette, pipette, conical flask.
 仪器：滴定管、移液管、锥形瓶。
3. Preparation of Insoluble Salts 不溶盐的制备
• Method: Precipitation 方法：沉淀法
 Steps: Mix two soluble salt solutions → filter → wash residue with distilled water → dry in oven.
 步骤：混合两种可溶盐溶液 → 过滤 → 用蒸馏水洗涤沉淀 → 烘干。
• Example: BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2NaCl(aq)
 Ionic equation: Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s)
 (White precipitate 白色沉淀)
• Example: AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)
 Ionic equation: Ag⁺(aq) + Cl⁻(aq) → AgCl(s)
 (White precipitate, turns grey in light 白色沉淀，见光变灰)
4. Hydrated and Anhydrous Salts 水合盐与无水盐
• Hydrated salt: Contains water of crystallisation, e.g., CuSO₄·5H₂O (blue), CoCl₂·6H₂O (pink), FeSO₄·6H₂O (green).
 水合盐含有结晶水。
• Anhydrous salt: No water of crystallisation, e.g., CuSO₄ (white), CoCl₂ (blue).
 无水盐不含结晶水。
• Heating effect: Hydrated salt → heat → anhydrous salt + water.
 加热水合盐得到无水盐和水。
• Caution: Do not heat too strongly when drying, otherwise the salt may decompose or lose water of crystallisation.
 干燥时避免过度加热，否则盐可能分解或失去结晶水。
Key Difficulties 难点
• Memorising solubility rules and applying them to choose the correct method (excess solid vs. titration).
 记忆溶解性规则并选择正确方法（过量固体法 vs. 滴定法）。
• Understanding why excess solid is used and how to separate the product.
 理解为何使用过量固体以及如何分离产物。
• Recognising hydrated salts and the effect of heating.
 识别水合盐及加热的影响。

Chapter 13: The Periodic Table 元素周期表
Core Concepts 核心概念
1. Arrangement of the Periodic Table 周期表的排列
• Elements are arranged in order of increasing atomic (proton) number.
 元素按原子序数（质子数）递增排列。
• Groups: Vertical columns; elements in the same group have the same number of outer electrons and similar chemical properties.
 族：纵列；同族元素具有相同的最外层电子数和相似的化学性质。
• Periods: Horizontal rows; elements in the same period have the same number of electron shells.
 周期：横行；同周期元素具有相同的电子层数。
• Main-group elements: Groups I–VIII (excluding transition metals).
 主族元素：第I–VIII族（不含过渡金属）。
2. Group I – Alkali Metals 第I族 – 碱金属
• Physical properties: Soft, low density, low melting points, silvery appearance.
 物理性质：软、低密度、低熔点、银白色。
• Trends down the group: 
  • Melting point decreases. 熔点降低。
  • Density generally increases (except K). 密度通常增大。 
  • Reactivity increases. 反应性增强。
• Reaction with water: 2M(s) + 2H₂O(l) → 2MOH(aq) + H₂(g) (M = Li, Na, K) 
  • Lithium: fizzes slowly, no flame. 锂：缓慢冒泡，无火焰。
  • Sodium: melts into a ball, moves rapidly, no flame. 钠：熔成小球，快速移动，无火焰。
  • Potassium: ignites hydrogen with a lilac flame. 钾：点燃氢气，产生淡紫色火焰。
• Storage: Stored under oil to prevent reaction with air and moisture.
 储存：浸在油中以防与空气和水分反应。
3. Group VII – Halogens 第VII族 – 卤素
• Physical properties: Diatomic molecules (F₂, Cl₂, Br₂, I₂); colour intensity increases down the group; state changes from gas (Cl₂) to liquid (Br₂) to solid (I₂) at room temperature.
 物理性质：双原子分子；颜色加深；室温下状态从气体到液体到固体。
• Trends down the group: 
  • Melting and boiling points increase. 熔沸点升高。
  • Reactivity decreases. 反应性减弱。
• Displacement reactions: A more reactive halogen displaces a less reactive one from its halide solution.
 置换反应：更活泼的卤素置换出较不活泼的卤素。 
  • Cl₂ + 2KBr → 2KCl + Br₂ (colourless → orange)
  • Cl₂ + 2KI → 2KCl + I₂ (colourless → yellow-brown)
  • Br₂ + 2KI → 2KBr + I₂
• Test for chlorine: Damp blue litmus paper turns red then bleached white.
 氯气检验：湿润的蓝色石蕊试纸先变红后漂白变白。
4. Group VIII – Noble Gases 第VIII族 – 稀有气体
• Properties: Colourless, monatomic, unreactive (full outer shell: 8 electrons, except He with 2).
 性质：无色、单原子、不活泼（最外层满电子）。
• Uses: 
  • Helium: balloons, airships (light, unreactive).
  • Argon: filling light bulbs (inert at high temperature).
  • Neon: advertising signs (glows when electrified).
5. Transition Metals 过渡金属
• General properties: Hard, strong, high density, high melting points, less reactive than Group I/II.
 一般性质：硬、强、高密度、高熔点、反应性低于I/II族。
• Distinctive properties: 
  • Form coloured compounds (e.g., CuSO₄ blue, FeSO₄ green).
  • Act as catalysts (e.g., Fe in Haber process).
  • Have variable oxidation states (e.g., Fe²⁺ and Fe³⁺; CrO, Cr₂O₃, CrO₃).
  • Form more than one oxide.
6. Trends Across a Period 周期趋势
• Metallic character decreases from left to right. 金属性从左到右减弱。
• Non-metallic character increases. 非金属性增强。
• Bonding type changes: metallic → giant covalent → simple molecular.
 键型变化：金属键 → 巨型共价 → 简单分子。
• Example – Period 3: Na, Mg, Al (metallic); Si (giant covalent); P, S, Cl (simple molecular); Ar (monatomic).


Key Difficulties 难点
• Relating group number to ionic charge (Group I → +1, Group VII → -1, etc.).
 将族号与离子电荷关联。
• Understanding the trend in reactivity down Group I (increases) vs. Group VII (decreases).
 理解I族反应性增强而VII族减弱的趋势。
• Remembering the distinctive properties of transition metals (coloured compounds, variable oxidation states, catalysis).
 记住过渡金属的特性（有色化合物、可变氧化态、催化作用）。

Chapter 14: Metallic Elements and Alloys 金属元素与合金
Core Concepts 核心概念
1. Physical Properties of Metals 金属的物理性质
• Electrical conductivity: Due to delocalised (free) electrons that can move through the structure.
 导电性：由于离域电子可在结构中自由移动。
• Thermal conductivity: Vibrations of metal atoms are passed through the structure.
 导热性：金属原子的振动传递。
• Malleability & Ductility: Layers of metal atoms can slide over each other without breaking bonds.
 可塑性和延展性：金属原子层可相互滑动而不断键。
• Sonorous: Ringing sound when struck (dense, closely packed atoms transmit vibrations).
 有响声：敲击时发出响亮声音。
• High melting/boiling points: Strong metallic bonds require large energy to break.
 高熔沸点：强金属键需要大量能量才能破坏。
• Hardness and density: Generally hard and dense (except Na, K which are soft).
 硬度和密度：通常硬而密。
2. Reactions of Metals 金属的反应
• With oxygen/air: 
  • 2Mg + O₂ → 2MgO (bright white flame)
  • 4Al + 3O₂ → 2Al₂O₃ (protective oxide layer)
  • 3Fe + 2O₂ → Fe₃O₄ (in air) or 4Fe + 3O₂ → 2Fe₂O₃
• With water: 
  • Reactive metals (K, Na, Ca): 2M + 2H₂O → 2MOH + H₂ (cold water)
  • Mg: reacts very slowly with cold water, vigorously with steam: Mg + H₂O(g) → MgO + H₂
  • Zn, Fe: react with steam: Zn + H₂O(g) → ZnO + H₂; 3Fe + 4H₂O(g) → Fe₃O₄ + 4H₂
• With dilute acid: 
  • Mg + 2HCl → MgCl₂ + H₂
  • Zn + 2HCl → ZnCl₂ + H₂
  • Fe + 2HCl → FeCl₂ + H₂
  • Cu, Ag, Au: no reaction.
3. Alloys 合金
• Definition: Mixtures of metals (or metals with non-metals) designed for specific properties.
 定义：金属（或金属与非金属）的混合物，具有特定性能。
• Structure: Atoms of different sizes distort the regular lattice, making it harder for layers to slide → stronger and harder than pure metals.
 结构：不同大小的原子扭曲晶格，使层滑动更困难 → 比纯金属更强更硬。
• Examples: 
  • Brass: Cu (70%) + Zn (30%) – harder than Cu, used for musical instruments, ornaments.
  • Bronze: Cu (90%) + Sn (10%) – harder than Cu, used for statues, bells.
  • Mild steel: Fe (99.7%) + C (0.3%) – stronger than pure Fe, used for car bodies.
  • Stainless steel: Fe (74%) + Cr (18%) + Ni (8%) – hard, does not rust, used for cutlery, surgical instruments.
  • Solder: Sn (50%) + Pb (50%) – low melting point, used for electrical connections.
• Alloys still conduct electricity because delocalised electrons are still free to move.
 合金仍能导电，因为离域电子仍可自由移动。
Key Difficulties 难点
• Explaining why alloys are harder than pure metals in terms of atomic structure.
 从原子结构解释合金为何比纯金属硬。
• Linking properties of metals to their uses (e.g., Al low density for aircraft, Cu conductivity for wiring).
 将金属性质与用途关联。
• Remembering the composition and properties of common alloys.
 记住常见合金的成分和性质。
---
Chapter 15: Reactivity of Metals 金属的反应性
Core Concepts 核心概念
1. The Reactivity Series 金属活动性顺序
• Order (most reactive first): K, Na, Ca, Mg, Al, (C), Zn, Fe, (H), Cu, Ag, Au
 顺序（从高到低）：钾、钠、钙、镁、铝、（碳）、锌、铁、（氢）、铜、银、金
• Reactivity refers to the ease with which a metal forms its positive ion (loses electrons).
 反应性指金属形成阳离子（失去电子）的难易程度。
• Hydrogen is included for comparison; metals above H can displace H from acids/water.
 氢被纳入以便比较；氢以上的金属可从酸或水中置换出氢。
2. Reactions with Water and Acids 与水及酸的反应
• Group I metals: Violent reaction with cold water, producing hydroxide and H₂.
• Ca: Moderate reaction with cold water.
• Mg: Slow with cold water, vigorous with steam.
• Al: Protective oxide layer slows reaction with acid; once removed, reacts.
• Zn, Fe: React with steam or dilute acids.
• Cu, Ag, Au: No reaction with water or dilute acids.
3. Displacement Reactions 置换反应
• Definition: A more reactive metal displaces a less reactive metal from a solution of its salt.
 定义：更活泼的金属从其盐溶液中置换出较不活泼的金属。
• Example: Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s)
 Observations: blue solution fades, grey solid deposits.
 现象：蓝色溶液变浅，灰色固体析出。
• Example: Cu(s) + 2AgNO₃(aq) → Cu(NO₃)₂(aq) + 2Ag(s)
 Observations: colourless solution turns blue, silver crystals form.
 现象：无色溶液变蓝，银白色晶体析出。
• Redox nature: The more reactive metal loses electrons (oxidised), the less reactive metal ions gain electrons (reduced).
 氧化还原本质：更活泼金属失去电子（被氧化），较不活泼金属离子得到电子（被还原）。
• Ionic equation: Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s)
4. Aluminium’s Apparent Low Reactivity 铝的表观低反应性
• Al reacts readily with oxygen to form a thin, adherent layer of Al₂O₃.
 铝易与氧反应形成致密的氧化铝薄膜。
• This layer protects the metal from further reaction with water or acid.
 该层保护金属不与水或酸进一步反应。
• Once the layer is removed (e.g., by heating or scratching), Al reacts vigorously.
 一旦去除氧化层（如加热或刮擦），铝会剧烈反应。
Key Difficulties 难点
• Memorising the reactivity series (use a mnemonic).
 记忆活动性顺序（使用口诀）。
• Predicting displacement reactions and writing ionic equations.
 预测置换反应并书写离子方程式。
• Understanding the role of the oxide layer in aluminium’s behaviour.
 理解氧化层在铝反应行为中的作用。

Chapter 16: Extraction and Corrosion of Metals 金属的提取与腐蚀
Core Concepts 核心概念
1. Extraction Methods Based on Reactivity 基于反应性的提取方法
• Metals below carbon in the series (Zn, Fe, Cu): extracted by reduction with carbon (heating oxide with carbon/coke).
 碳以下的金属：用碳还原（加热氧化物与碳/焦炭）。
• Metals above carbon (K, Na, Ca, Mg, Al): extracted by electrolysis of molten ore.
 碳以上的金属：通过电解熔融矿石提取。
• Very unreactive metals (Ag, Au): found native (uncombined) in the Earth’s crust.
 极不活泼金属：以游离态存在于地壳中。
2. Extraction of Iron – Blast Furnace 铁的提取 – 高炉
• Raw materials: hematite (Fe₂O₃), coke (C), limestone (CaCO₃), air.
 原料：赤铁矿、焦炭、石灰石、空气。
• Key reactions: 
  • C + O₂ → CO₂ (heat)
  • CO₂ + C → 2CO
  • Fe₂O₃ + 3CO → 2Fe + 3CO₂ (reduction)
  • CaCO₃ → CaO + CO₂ (decomposition)
  • CaO + SiO₂ → CaSiO₃ (slag formation – removes impurities)
• Products: Molten iron (about 95% pure) and slag (calcium silicate).
 产物：熔融铁（约95%纯）和炉渣（硅酸钙）。
3. Extraction of Aluminium – Electrolysis 铝的提取 – 电解
• Ore: Bauxite (Al₂O₃).
 矿石：铝土矿。
• Process: 
  • Bauxite is purified to alumina (Al₂O₃).
  • Alumina is dissolved in molten cryolite (Na₃AlF₆) to lower the melting point (~950°C).
  • Electrolysis: 
    • Cathode: Al³⁺ + 3e⁻ → Al(l) (reduction)
    • Anode: 2O²⁻ → O₂ + 4e⁻ (oxidation); oxygen reacts with carbon anode to form CO₂, so anodes need regular replacement.
• Why expensive: High electricity cost; anodes need frequent replacement.
 为何昂贵：高电耗；阳极需频繁更换。
4. Corrosion of Iron – Rusting 铁的腐蚀 – 生锈
• Rust: Hydrated iron(III) oxide, Fe₂O₃·xH₂O.
 铁锈：水合氧化铁。
• Conditions required: Oxygen (air) and water.
 必要条件：氧气（空气）和水。
• Accelerating factors: Salt (e.g., seawater) and acid rain.
 加速因素：盐和酸雨。
5. Rust Prevention 防锈方法
• Barrier methods: Painting, oiling/greasing, plastic coating, electroplating (with tin or chromium).
 屏障法：喷漆、涂油、塑料涂层、电镀。
• Galvanising: Coating with zinc. Even if scratched, zinc corrodes preferentially (sacrificial protection) because Zn is more reactive than Fe.
 镀锌：即使涂层破损，锌优先腐蚀（牺牲保护）。
• Sacrificial protection: Attaching blocks of a more reactive metal (e.g., Zn, Mg) to the iron structure; the more reactive metal corrodes instead of iron.
 牺牲保护：连接更活泼金属块（如锌、镁），该金属腐蚀而铁被保护。
Key Difficulties 难点
• Explaining why aluminium must be extracted by electrolysis while iron can be reduced by carbon.
 解释为何铝必须电解而铁可用碳还原。
• Writing balanced equations for the blast furnace reactions.
 书写高炉反应的平衡方程式。
• Understanding the role of cryolite and why anodes burn away.
 理解冰晶石的作用及阳极消耗的原因。
• Distinguishing between barrier methods, galvanising, and sacrificial protection.
 区分屏障法、镀锌和牺牲保护。

Chapter 18: Introduction to Organic Chemistry 有机化学导论
Core Concepts 核心概念
1. Homologous Series 同系列
• Definition: A series of organic compounds with the same functional group, same general formula, similar chemical properties, and a trend in physical properties.
 定义：具有相同官能团、相同通式、相似化学性质和物理性质递变的一系列有机化合物。
• Examples: 
  • Alkanes: CₙH₂ₙ₊₂ (e.g., CH₄, C₂H₆)
  • Alkenes: CₙH₂ₙ (e.g., C₂H₄, C₃H₆)
  • Alcohols: CₙH₂ₙ₊₁OH (e.g., CH₃OH, C₂H₅OH)
  • Carboxylic acids: CₙH₂ₙ₊₁COOH (e.g., HCOOH, CH₃COOH)
2. Functional Groups 官能团
• Alkane: C–C single bond (saturated)
• Alkene: C=C double bond (unsaturated)
• Alcohol: –OH (hydroxyl group)
• Carboxylic acid: –COOH (carboxyl group)
• Ester: –COO– (ester linkage)
3. Naming Organic Compounds 有机化合物命名
• Prefix: Number of carbon atoms (meth- 1, eth- 2, prop- 3, but- 4, pent- 5, hex- 6)
• Suffix: Indicates functional group (-ane, -ene, -anol, -anoic acid, -yl ... -anoate for esters)
• Examples: 
  • C₄H₁₀ → butane
  • C₃H₆ → propene
  • C₃H₇OH → propanol
  • C₃H₇COOH → butanoic acid
4. Structural Isomerism 结构异构
• Definition: Compounds with the same molecular formula but different structural formulae.
 定义：分子式相同但结构式不同的化合物。
• Example: C₄H₁₀ has two isomers: butane (straight chain) and methylpropane (branched).
 例：丁烷和甲基丙烷。
• Position isomerism: Same functional group but different position (e.g., propan-1-ol vs. propan-2-ol).
 位置异构：官能团位置不同。
5. Saturated vs. Unsaturated 饱和与不饱和
• Saturated: Contains only single bonds (alkanes).
 饱和：只含单键。
• Unsaturated: Contains at least one double or triple bond (alkenes).
 不饱和：含至少一个双键或三键。
• Test: Add bromine water; unsaturated compounds decolourise it (orange → colourless).
 检验：加入溴水，不饱和化合物使其褪色。
Key Difficulties 难点
• Learning the naming rules and applying suffixes correctly.
 学习命名规则并正确使用后缀。
• Drawing structural isomers and recognising position isomerism.
 画出结构异构体并识别位置异构。
• Understanding the relationship between functional group and chemical properties.
 理解官能团与化学性质的关系。

Chapter 19: Reactions of Organic Compounds 有机化合物的反应
(Based on the previously uploaded PPT “19 Reactions of Organic Compounds.pptx” and standard IGCSE syllabus)
（基于之前上传的PPT和标准IGCSE大纲）
Core Concepts 核心概念
1. Reactions of Alkanes – Substitution 烷烃的反应 – 取代
• Combustion: 
  • Complete: CH₄ + 2O₂ → CO₂ + 2H₂O
  • Incomplete: 2CH₄ + 3O₂ → 2CO + 4H₂O (produces toxic CO)
• Substitution with halogens: Requires ultraviolet (UV) light.
 与卤素取代：需要紫外线。 
  • CH₄ + Cl₂ →(UV) CH₃Cl + HCl
  • Further substitution yields CH₂Cl₂, CHCl₃, CCl₄.
2. Reactions of Alkenes – Addition 烯烃的反应 – 加成
• Source: Catalytic cracking of long-chain alkanes (e.g., C₁₀H₂₂ → C₈H₁₀ + C₂H₄).
 来源：长链烷烃催化裂解。
• Addition reactions (C=C opens): 
  • With bromine: C₂H₄ + Br₂ → CH₂BrCH₂Br (bromine water decolourised – test for unsaturation)
  • With hydrogen (hydrogenation): C₂H₄ + H₂ →(Ni catalyst, 150-300°C) C₂H₆ (used to harden vegetable oils)
  • With steam (hydration): C₂H₄ + H₂O →(H₃PO₄ catalyst, 300°C, 6000 kPa) C₂H₅OH (industrial ethanol production)
3. Chemistry of Ethanol 乙醇的化学性质
• Manufacture – two methods: 
Method	Fermentation	Hydration of ethene
Starting material	Glucose (renewable)	Ethene from petroleum (non-renewable)
Conditions	Yeast, anaerobic, ~37°C	H₃PO₄ catalyst, 300°C, 6000 kPa
Equation	C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂	C₂H₄ + H₂O → C₂H₅OH
Advantages	Renewable, simple equipment	Fast, high purity
Disadvantages	Slow, needs distillation	Non-renewable, high pressure
• Oxidation to carboxylic acid: 
  • Reagent: acidified KMnO₄ (purple → colourless) or acidified K₂Cr₂O₇ (orange → green).
  • C₂H₅OH + 2[O] →(KMnO₄/H⁺) CH₃COOH + H₂O
• Combustion: C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O
4. Carboxylic Acids and Esters 羧酸与酯
• Carboxylic acids are weak acids: 
  • With metal: 2CH₃COOH + Mg → (CH₃COO)₂Mg + H₂
  • With base: CH₃COOH + NaOH → CH₃COONa + H₂O
  • With carbonate: 2CH₃COOH + CaCO₃ → (CH₃COO)₂Ca + H₂O + CO₂
• Esterification: 
  • CH₃COOH + C₂H₅OH ⇌(conc. H₂SO₄, heat) CH₃COOC₂H₅ + H₂O
  • Product: ethyl ethanoate (fruity smell).
  • Reversible reaction (⇌); conc. H₂SO₄ acts as catalyst and dehydrating agent.
Key Difficulties 难点
• Distinguishing substitution (alkanes) from addition (alkenes).
 区分取代（烷烃）和加成（烯烃）。
• Remembering specific conditions for each reaction (catalyst, temperature, pressure, UV light).
 记住每个反应的具体条件。
• Comparing fermentation and hydration for ethanol production.
 对比发酵法和水合法制乙醇。
• Understanding that esterification is reversible and the role of concentrated H₂SO₄.
 理解酯化反应的可逆性及浓硫酸的作用。

Overall Common Pitfalls & Exam Focus 总体易错点与考试重点
Common Pitfalls 常见易错点
1. Confusing soluble and insoluble salts – always refer to solubility rules before choosing a method.
 混淆可溶与不溶盐 – 选择方法前先查溶解性规则。
2. Mixing up group trends – Group I reactivity increases down; Group VII decreases.
 混淆族趋势 – I族反应性向下增强，VII族减弱。
3. Forgetting the oxide layer on aluminium – it explains why Al appears less reactive.
 忘记铝的氧化层 – 这解释了铝为何表现不活泼。
4. Misunderstanding alloy structure – alloys are not mixtures of separate crystals but distorted lattices.
 误解合金结构 – 合金不是分离晶体的混合物，而是扭曲的晶格。
5. Writing incorrect ionic equations for displacement – include state symbols and charges.
 写错置换反应的离子方程式 – 需包含状态符号和电荷。
6. Omitting conditions for organic reactions – UV for substitution, Ni for hydrogenation, H₃PO₄ for hydration.
 遗漏有机反应条件 – 取代需UV，氢化需Ni，水合需H₃PO₄。
7. Confusing fermentation and hydration – one is biological, the other industrial.
 混淆发酵法和水合法 – 一个是生物法，一个是工业法。
8. Forgetting that esterification is reversible – use ⇌ and mention conc. H₂SO₄ as dehydrating agent.
 忘记酯化反应可逆 – 使用⇌并说明浓硫酸的吸水作用。
Exam Focus 考试重点
• Writing balanced symbol equations for all reactions (including state symbols).
 书写所有反应的平衡符号方程式（含状态符号）。
• Stating reaction conditions (catalyst, temperature, pressure, light).
 说明反应条件。
• Identifying reaction types (substitution, addition, esterification, redox, precipitation).
 识别反应类型。
• Comparing methods (e.g., ethanol production, salt preparation).
 对比不同方法。
• Describing tests (bromine water for unsaturation, chlorine test with litmus, flame tests for Group I).
 描述检验方法。
• Explaining trends in the Periodic Table and reactivity series.
 解释周期表和反应性顺序的趋势。
• Applying solubility rules to choose the correct salt preparation method.
 应用溶解性规则选择正确的盐制备方法。
• Understanding rust prevention mechanisms (barrier, galvanising, sacrificial).
 理解防锈机制。</p>
