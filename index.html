<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随便整理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4f8, #e8edf5);
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px; /* 单栏更舒适的最大宽度，比原来的1600px窄一点，不会太宽 */
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: 36px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        /* 核心修改：强制单栏，去掉自动分栏逻辑 */
        .pdf-grid {
            display: grid;
            grid-template-columns: 1fr; /* 永远只有1列 */
            gap: 40px; /* 保持卡片之间的上下间距 */
        }

        .pdf-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .pdf-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .card-head {
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            color: #fff;
            padding: 18px;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
        }

        /* PDF 高度保持850，超大看得清 */
        .pdf-iframe {
            width: 100%;
            height: 850px;
            border: none;
        }

        .card-foot {
            padding: 16px;
            text-align: center;
            background: #f8fafc;
        }

        .card-foot a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            font-size: 17px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">随便整理的知识点 我乱搞的 可能不全 而且只有重点 感谢访问 有问题可以反馈</h1>

        <div class="pdf-grid">
            <!-- 第一个PDF -->
            <div class="pdf-card">
                <div class="card-head">数学 指数对数与三角函数</div>
                <iframe class="pdf-iframe" src="/PDF/math1.pdf" type="application/pdf"></iframe>
                <div class="card-foot">
                    <a href="/PDF/math1.pdf" target="_blank">新标签页打开 / 下载PDF（可放大阅读）</a>
                </div>
            </div>

            <!-- 第二个PDF -->
            <div class="pdf-card">
                <div class="card-head">语文</div>
                <iframe class="pdf-iframe" src="/PDF/Chinese.pdf" type="application/pdf"></iframe>
                <div class="card-foot">
                    <a href="/PDF/Chinese.pdf" target="_blank">新标签页打开 / 下载PDF（可放大阅读）</a>
                </div>
            </div>

            <!-- 新增的第三个PDF（复制这个块继续加更多） -->
            <div class="pdf-card">
                <div class="card-head">物理 必修二</div> <!-- 改成你的PDF标题 -->
                <iframe class="pdf-iframe" src="/PDF/physics.pdf" type="application/pdf"></iframe> <!-- 改成你的PDF路径 -->
                <div class="card-foot">
                    <a href="/PDF/physics.pdf" target="_blank">新标签页打开 / 下载PDF（可放大阅读）</a> <!-- 改成对应的下载路径 -->
                </div>
            </div>

        </div>
    </div>
</body>
</html>
