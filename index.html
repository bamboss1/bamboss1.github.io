<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bamboss的主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:"Microsoft Yahei",sans-serif;
            background:#0f172a;
            color:#f1f5f9;
            line-height:1.6;
        }
        .container{
            max-width:800px;
            margin:0 auto;
            padding:60px 20px;
            text-align:center;
        }
        h1{
            font-size:42px;
            margin-bottom:20px;
            background:linear-gradient(90deg,#38bdf8,#a855f7);
            -webkit-background-clip:text;
            color:transparent;
        }
        .desc{
            font-size:18px;
            color:#94a3b8;
            margin-bottom:40px;
        }
        .nav a{
            display:inline-block;
            margin:10px;
            padding:12px 30px;
            border:1px solid #38bdf8;
            color:#38bdf8;
            text-decoration:none;
            border-radius:999px;
            transition:0.3s;
        }
        .nav a:hover{
            background:#38bdf8;
            color:#0f172a;
        }
        footer{
            margin-top:80px;
            color:#64748b;
            font-size:14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>你好，我是Rocky吗？</h1>
        <p class="desc">我是 | 我不是</p>

        <div class="nav">
            <a href="#">关于我</a>
            <a href="#">我的作品</a>
            <a href="#">联系方式</a>
        </div>

        <footer>
            感谢所有技术提供者和支持者
        </footer>
    </div>
</body>
</html>
